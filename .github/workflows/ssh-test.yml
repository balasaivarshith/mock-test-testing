
name: Test Cloudways SSH Connection

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY_B64: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          HOST: ${{ secrets.CLOUDWAYS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/mock-test_deploy
          chmod 600 ~/.ssh/mock-test_deploy

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Test Cloudways Connection
        run: |
          timeout 20s ssh -T \
            -i ~/.ssh/mock-test_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            ${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }} \
            'echo "SSH connection successful"; whoami; hostname; exit'

      - name: Test Mock Test Folder Write Access
        env:
          HOST: ${{ secrets.CLOUDWAYS_HOST }}
          USER: ${{ secrets.CLOUDWAYS_USER }}
        run: |
          ssh -T -i ~/.ssh/mock-test_deploy \
            -o BatchMode=yes \
            "$USER@$HOST" \
            'set -e
             cd /home/master/applications/kdqypjmcqc/public_html/mock-test
             echo "GitHub Actions deployment test" > github-actions-test.txt
             cat github-actions-test.txt
             rm github-actions-test.txt
             echo "Folder write test successful"'
