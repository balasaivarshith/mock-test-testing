
name: Test Cloudways Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mock-test-deploy-test/**'
      - '.github/workflows/deploy-test.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project
        working-directory: mock-test-deploy-test
        run: npm run build

      - name: Create deployment archive
        run: |
          tar -cJf "$RUNNER_TEMP/dist.tar.xz" \
            -C mock-test-deploy-test/dist .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.CLOUDWAYS_SSH_KEY }}" | base64 -d > ~/.ssh/mock-test_deploy
          chmod 600 ~/.ssh/mock-test_deploy
          ssh-keyscan -H "${{ secrets.CLOUDWAYS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload and extract files
        run: |
          scp -i ~/.ssh/mock-test_deploy \
            "$RUNNER_TEMP/dist.tar.xz" \
            "${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}:~/mock-test-deploy-test.tar.xz"

          ssh -T -i ~/.ssh/mock-test_deploy \
            -o ConnectTimeout=15 \
            "${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}" \
            'mkdir -p /home/master/applications/kdqypjmcqc/public_html/mock-test-deploy-test &&
             tar -xJf ~/mock-test-deploy-test.tar.xz -C /home/master/applications/kdqypjmcqc/public_html/mock-test-deploy-test &&
             rm -f ~/mock-test-deploy-test.tar.xz &&
             echo "Deployment successful"'
